<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Fond transparent -->

  <!-- Icône : losange stylisé Mobile Money -->
  <g transform="translate(8, 8)">
    <!-- Losange extérieur jaune -->
    <polygon points="32,0 64,32 32,64 0,32" fill="#F5A623"/>
    <!-- Losange intérieur noir -->
    <polygon points="32,12 52,32 32,52 12,32" fill="#1A1A1A"/>
    <!-- Centre jaune (signal) -->
    <polygon points="32,22 42,32 32,42 22,32" fill="#F5A623"/>
    <!-- Point central -->
    <circle cx="32" cy="32" r="5" fill="#1A1A1A"/>
  </g>

  <!-- Texte ALBARKA -->
  <text
    x="88" y="46"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="900"
    letter-spacing="2"
    fill="#1A1A1A"
  >ALBARKA</text>

  <!-- Sous-titre -->
  <text
    x="90" y="64"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="3"
    fill="#F5A623"
  >SUPER AGENT MOBILE MONEY</text>
</svg>
